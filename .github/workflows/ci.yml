name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Gate: CI only runs when the triggering commit message contains "github build"
  # (case-insensitive). For push events that's the pushed commit; for pull_request
  # events it's the PR's head commit (fetched via the API, since checkout's merge
  # commit message isn't what the author wrote).
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for "github build" trigger phrase
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            let message = "";
            if (context.eventName === "push") {
              message = context.payload.head_commit?.message || "";
            } else if (context.eventName === "pull_request") {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
              });
              message = commit.commit.message || "";
            }
            const shouldRun = message.toLowerCase().includes("github build");
            core.info(`commit message: ${JSON.stringify(message)}`);
            core.info(`should_run: ${shouldRun}`);
            core.setOutput("should_run", String(shouldRun));

  # Full build + vet + test on the Unix targets moony is developed and shipped for.
  test:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Windows is a build target only: the runtime test suite assumes a Unix
  # environment (flock, exec-bit, POSIX paths), so we verify compilation +
  # vet here rather than running tests.
  windows-build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # Formatting check on Linux (LF checkout) so CRLF working copies don't
  # produce false positives.
  gofmt:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
