# Auth for the moony relay — OPTIONAL, but read this before exposing the relay.
#
# With MN_AUTH unset the relay runs OPEN: anyone who can reach :8770 can drive the
# connected machine's agent — read its files, and run shell commands on it. That is
# reasonable on localhost and inside a trusted network; it is not something to put on a
# public address.
#
# When MN_AUTH=on the relay requires the FULL set below and performs OIDC discovery at
# startup. A missing variable or an unreachable issuer is fatal by design: it fails
# closed rather than starting half-secured, so a typo cannot silently drop the gate.
#
# Create it for real with `kubectl create secret generic` (below) rather than committing
# values — this file is a template and its contents are examples, not credentials.
#
#   kubectl create secret generic moony-relay-auth \
#     --from-literal=MN_AUTH=on \
#     --from-literal=MN_AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MN_OIDC_ISSUER=https://accounts.example.com \
#     --from-literal=MN_OIDC_CLIENT_ID=moony-relay \
#     --from-literal=MN_OIDC_CLIENT_SECRET=... \
#     --from-literal=MN_OIDC_REDIRECT_URL=https://relay.example.com/auth/callback \
#     --from-literal=MN_AUTH_ADMINS=you@example.com
apiVersion: v1
kind: Secret
metadata:
  name: moony-relay-auth
  labels:
    app.kubernetes.io/name: moony-relay
type: Opaque
stringData:
  # "on" | "1" | "true" | "yes" enable the gate; anything else (or unset) leaves the
  # relay open.
  MN_AUTH: "on"

  # Signs both the browser session cookie and the connector's tunnel credential, so
  # every replica must share the SAME value or tokens minted by one pod are rejected by
  # another. Generate with: openssl rand -hex 32
  MN_AUTH_SECRET: "replace-me-with-openssl-rand-hex-32"

  # OIDC (Authorization Code + PKCE). REDIRECT_URL must be the relay's public URL plus
  # the callback path, and must be registered with the provider verbatim.
  MN_OIDC_ISSUER: "https://accounts.example.com"
  MN_OIDC_CLIENT_ID: "moony-relay"
  MN_OIDC_CLIENT_SECRET: "replace-me"
  MN_OIDC_REDIRECT_URL: "https://relay.example.com/auth/callback"

  # Optional. Comma-separated accounts granted the admin surface.
  MN_AUTH_ADMINS: "you@example.com"

  # Optional. Session lifetime, e.g. "24h". Defaults are applied when unset.
  # MN_AUTH_TTL: "24h"

  # Optional. Which OIDC claim identifies the account (default is provider-dependent).
  # MN_OIDC_ACCOUNT_CLAIM: "email"
