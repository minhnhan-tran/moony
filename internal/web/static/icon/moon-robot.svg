<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 976" width="1080" height="976" font-family="sans-serif">
  <defs>
    <radialGradient id="moonGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f4f1e0"/>
      <stop offset="100%" stop-color="#e6e2cf"/>
    </radialGradient>
    <style>
      /* Twinkling stars */
      @keyframes twinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(.7)} }
      .star { animation: twinkle 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star:nth-of-type(2n){ animation-duration: 1.7s; animation-delay: .25s; }
      .star:nth-of-type(3n){ animation-duration: 1s;   animation-delay: .5s; }
      .star:nth-of-type(4n){ animation-duration: 2s;   animation-delay: .15s; }

      /* Sparkle stars: twinkle + slow spin */
      @keyframes sparkle { 0%,100%{opacity:1;transform:rotate(0deg) scale(1)} 50%{opacity:.4;transform:rotate(45deg) scale(.75)} }
      .sparkle { animation: sparkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      /* Drifting clouds */
      @keyframes driftR { 0%{transform:translateX(0)} 50%{transform:translateX(38px)} 100%{transform:translateX(0)} }
      @keyframes driftL { 0%{transform:translateX(0)} 50%{transform:translateX(-42px)} 100%{transform:translateX(0)} }
      .cloud-a{ animation: driftR 5s ease-in-out infinite; }
      .cloud-b{ animation: driftL 6.5s ease-in-out infinite; }
      .cloud-c{ animation: driftL 8s ease-in-out infinite; }
      .cloud-d{ animation: driftR 5.5s ease-in-out infinite; }

      /* Glowing moon */
      @keyframes glow { 0%,100%{opacity:.0} 50%{opacity:.5} }
      .moon-glow{ animation: glow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      /* Claude character (from claude-jumping.svg) */
      .claude-body { animation: jump 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .cl-shadow { animation: shadow-scale 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .left-arm { animation: wave-left 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
      .right-arm { animation: wave-right 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .left-ear { animation: ear-bounce 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .right-ear { animation: ear-bounce 1.2s ease-in-out infinite 0.2s; transform-box: fill-box; transform-origin: center bottom; }
      @keyframes jump { 0%,100%{transform:translateY(0) scaleY(1) scaleX(1)} 30%{transform:translateY(-16px) scaleY(1.1) scaleX(0.95)} 50%{transform:translateY(-18px) scaleY(1.05) scaleX(0.98)} 80%{transform:translateY(-5px) scaleY(0.95) scaleX(1.05)} }
      @keyframes shadow-scale { 0%,100%{transform:scaleX(1);opacity:0.25} 50%{transform:scaleX(0.4);opacity:0.08} }
      @keyframes wave-left { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-25deg)} }
      @keyframes wave-right { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(25deg)} }
      @keyframes ear-bounce { 0%,100%{transform:scaleY(1)} 40%{transform:scaleY(1.2)} 60%{transform:scaleY(0.85)} }

      @media (prefers-reduced-motion: reduce){ * { animation: none !important; } }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1080" height="976" fill="#152944"/>

  <!-- Lighter sky halo behind moon -->
  <polygon points="540,40 900,150 940,560 700,720 380,720 140,560 180,150" fill="#1c3557"/>

  <!-- Stars -->
  <g fill="#e9e9ec">
    <rect class="star" x="160" y="88" width="14" height="14"/>
    <rect class="star" x="60" y="322" width="12" height="12"/>
    <rect class="star" x="168" y="738" width="14" height="14"/>
    <rect class="star" x="118" y="828" width="18" height="18"/>
  </g>
  <g fill="#f2d24b">
    <rect class="star" x="206" y="592" width="13" height="13"/>
    <rect class="star" x="812" y="512" width="13" height="13"/>
    <rect class="star" x="286" y="852" width="12" height="12"/>
    <rect class="star" x="960" y="662" width="13" height="13"/>
    <rect class="star" x="978" y="690" width="9" height="9"/>
  </g>
  <!-- Plus-shaped stars -->
  <g fill="#eef0f2">
    <path class="star" d="M96 848 h20 v-8 h-20 v-20 h-8 v20 h-20 v8 h20 v20 h8 z" opacity="0.95"/>
    <path class="star" d="M948 660 h20 v-8 h-20 v-20 h-8 v20 h-20 v8 h20 v20 h8 z"/>
  </g>
  <path class="star" d="M986 918 h22 v-8 h-22 v-22 h-8 v22 h-22 v8 h22 v22 h8 z" fill="#8fa4c4"/>
  <!-- 4-point sparkle stars -->
  <path class="sparkle" d="M986 92 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" fill="#f4f4f6"/>
  <g fill="#9aa9c2">
    <circle class="star" cx="378" cy="52" r="6"/>
    <circle class="star" cx="960" cy="48" r="6"/>
    <circle class="star" cx="1002" cy="132" r="6"/>
    <circle class="star" cx="1012" cy="712" r="5"/>
    <circle class="star" cx="944" cy="742" r="5"/>
  </g>

  <!-- Moon -->
  <circle class="moon-glow" cx="540" cy="300" r="240" fill="#f4f1e0"/>
  <circle cx="540" cy="300" r="215" fill="url(#moonGrad)"/>
  <g fill="#d9d5c2">
    <circle cx="470" cy="200" r="45"/>
    <circle cx="628" cy="238" r="30"/>
    <circle cx="690" cy="330" r="20"/>
    <circle cx="600" cy="360" r="52"/>
    <circle cx="430" cy="340" r="34"/>
    <circle cx="500" cy="420" r="26"/>
    <circle cx="640" cy="440" r="22"/>
    <circle cx="560" cy="160" r="16"/>
  </g>

  <!-- Clouds -->
  <g class="cloud-d" fill="#c3c8d2">
    <!-- small top-left cloud -->
    <ellipse cx="190" cy="230" rx="120" ry="42"/>
    <circle cx="150" cy="212" r="40"/>
    <circle cx="210" cy="196" r="52"/>
    <circle cx="262" cy="216" r="40"/>
    <rect x="70" y="230" width="240" height="42"/>
  </g>
  <g class="cloud-c" fill="#c3c8d2">
    <!-- small right cloud -->
    <ellipse cx="940" cy="470" rx="90" ry="30"/>
    <circle cx="905" cy="455" r="30"/>
    <circle cx="955" cy="448" r="38"/>
    <rect x="850" y="470" width="180" height="30"/>
  </g>

  <!-- big left cloud -->
  <g class="cloud-b" fill="#aeb4c0">
    <ellipse cx="300" cy="440" rx="260" ry="55"/>
    <circle cx="130" cy="430" r="55"/>
    <circle cx="215" cy="400" r="70"/>
    <circle cx="320" cy="382" r="78"/>
    <circle cx="430" cy="410" r="60"/>
    <circle cx="500" cy="440" r="48"/>
    <rect x="55" y="440" width="500" height="55"/>
  </g>
  <!-- big right cloud -->
  <g class="cloud-a" fill="#aeb4c0">
    <ellipse cx="820" cy="360" rx="255" ry="52"/>
    <circle cx="640" cy="352" r="52"/>
    <circle cx="730" cy="318" r="68"/>
    <circle cx="835" cy="300" r="80"/>
    <circle cx="945" cy="330" r="60"/>
    <rect x="570" y="358" width="510" height="52"/>
  </g>

  <!-- Claude character (scaled/positioned from claude-jumping.svg) -->
  <g transform="translate(330,549) scale(4.2)">
    <!-- Shadow -->
    <ellipse class="cl-shadow" cx="50" cy="82" rx="22" ry="5" fill="#000"/>
    <g class="claude-body">
      <rect class="left-ear" x="22" y="10" width="8" height="14" fill="#E07C4C"/>
      <rect class="right-ear" x="70" y="10" width="8" height="14" fill="#E07C4C"/>
      <rect x="18" y="24" width="64" height="4" fill="#E07C4C"/>
      <rect x="14" y="28" width="72" height="32" fill="#E07C4C"/>
      <rect x="30" y="34" width="8" height="10" fill="#000000"/>
      <rect x="62" y="34" width="8" height="10" fill="#000000"/>
      <rect class="left-arm" x="2" y="36" width="12" height="8" fill="#E07C4C"/>
      <rect class="right-arm" x="86" y="36" width="12" height="8" fill="#E07C4C"/>
      <rect x="24" y="60" width="12" height="14" fill="#E07C4C"/>
      <rect x="64" y="60" width="12" height="14" fill="#E07C4C"/>
    </g>
  </g>
</svg>
